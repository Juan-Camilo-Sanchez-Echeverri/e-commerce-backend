# Desarrollo y ambiente de prueba.
#
#   Infra para correr la app en el host (`pnpm start:dev`):
#     docker compose --env-file .env.local -f ./docker/docker-compose.dev.yml up -d
#
#   Stack completo, con la API contenedorizada (ambiente de prueba):
#     docker compose --env-file .env.development -f ./docker/docker-compose.dev.yml --profile app up -d --build
#
# El servicio `backend` esta detras del perfil `app`, asi el mismo compose sirve
# para los dos flujos.
services:
  mongodb-primary:
    image: mongo:7
    container_name: ecom-mongodb-primary-dev
    restart: always
    ports:
      - '127.0.0.1:27017:27017'
    volumes:
      - '../mongo-dev:/data/db'
    command: >
      bash -c "
        mongod --replSet rs0 --bind_ip_all &
        until mongosh --eval 'print(\"ready\")' >/dev/null 2>&1; do sleep 2; done
        mongosh --eval 'rs.initiate({ _id: \"rs0\", members: [{ _id: 0, host: \"mongodb-primary:27017\" }] })' || true
        wait
      "
    healthcheck:
      test: mongosh --quiet --eval 'db.runCommand("ping").ok'
      interval: 5s
      timeout: 10s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: ecom-redis-dev
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD} --port ${REDIS_PORT}
    ports:
      - '127.0.0.1:${REDIS_PORT}:${REDIS_PORT}'
    volumes:
      - '../redis-dev:/data'
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD}', '--no-auth-warning', 'ping']
      interval: 5s
      timeout: 10s
      retries: 10

  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: ecom-redis-commander-dev
    restart: always
    environment:
      - REDIS_HOSTS=local:redis:${REDIS_PORT}:0:${REDIS_PASSWORD}
      - HTTP_USER=${REDIS_ADMIN_USER}
      - HTTP_PASSWORD=${REDIS_ADMIN_PASSWORD}
    ports:
      - '127.0.0.1:8083:8081'
    depends_on:
      redis:
        condition: service_healthy

  backend:
    container_name: ecom-backend-dev
    restart: always
    profiles:
      - app
    build:
      context: ..
      dockerfile: docker/dockerfile
    env_file:
      - ../.env.${NODE_ENV}
    volumes:
      - ../uploads:/app/uploads
    ports:
      - '127.0.0.1:${PORT}:${PORT}'
    depends_on:
      mongodb-primary:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "require('http').get('http://localhost:${PORT}/api/v1/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s